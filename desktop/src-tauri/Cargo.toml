[package]
name = "hearth-desktop"
version = "0.1.0"
description = "Hearth — a warm, private, local AI for your desktop"
authors = ["Kevin Champlin"]
edition = "2021"

# The library is what Tauri actually runs (keeps main.rs a one-liner; mobile-ready).
[lib]
name = "hearth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
